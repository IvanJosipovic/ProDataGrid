name: Build

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - master
      - main
      - develop

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-suffix: ${{ steps.version.outputs.version-suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "version-suffix=" >> $GITHUB_OUTPUT
          else
            echo "version-suffix=-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' build/SharedVersion.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:VersionSuffix="${{ steps.version.outputs.version-suffix }}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}"

      - name: Test
        run: dotnet test -c Release --no-build --settings build/ci.runsettings --logger trx --results-directory artifacts/test --filter FullyQualifiedName!~LeakTests -p:TestTfmsInParallel=false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: Test Results (${{ matrix.os }})
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  native-aot-smoke:
    name: NativeAOT Source Generation Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NativeAOT smoke application
        run: dotnet restore tests/ProDataGrid.SourceGeneration.AotSmoke/ProDataGrid.SourceGeneration.AotSmoke.csproj -r linux-x64

      - name: Build with generated trimming warnings as errors
        run: dotnet build tests/ProDataGrid.SourceGeneration.AotSmoke/ProDataGrid.SourceGeneration.AotSmoke.csproj -c Release -r linux-x64 --no-restore -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}"

      - name: Publish NativeAOT smoke application
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          dotnet publish tests/ProDataGrid.SourceGeneration.AotSmoke/ProDataGrid.SourceGeneration.AotSmoke.csproj -c Release -r linux-x64 --self-contained true --no-restore -p:WarningsAsErrors= -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}" -o artifacts/nativeaot-smoke 2>&1 | tee artifacts/nativeaot-smoke.log
          if grep -E 'obj/.*/ProDataGrid\.SourceGenerators/ProDataGrid\.SourceGenerators\.ProDataGridGenerator/.*(warning|error) IL[0-9]+' artifacts/nativeaot-smoke.log; then
            exit 1
          fi

      - name: Run NativeAOT smoke application
        run: ./artifacts/nativeaot-smoke/ProDataGrid.SourceGeneration.AotSmoke

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: [build, test, native-aot-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}"

      - name: Pack
        run: dotnet pack -c Release --no-build -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}" -o artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30
